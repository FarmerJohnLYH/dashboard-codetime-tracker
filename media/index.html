}.path{font:12px var(--vscode-editor-font-family,monospace);overflow-wrap:anywhere;white-space:normal}.file .muted{margin-top:5px}.bucket{display:grid;grid-template-columns:74px minmax(0,1fr);gap:18px;border-top:1px solid var(--vscode-panel-border,#383838);padding:16px 0}.bucket-time{font:13px var(--vscode-editor-font-family,monospace);color:var(--vscode-descriptionForeground,#aaa);padding-top:8px}.bucket-body{min-width:0}.row-tools{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--vscode-descriptionForeground,#aaa)}.row-tools[hidden]{display:none}.row-tools button{padding:2px 9px;border:1px solid var(--vscode-panel-border,#444)}.row-tools button:disabled{opacity:.3;cursor:default}.event-strip{display:grid;grid-auto-flow:column;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:9px;scrollbar-width:thin;grid-auto-columns:100%}.event-strip.cards-2{grid-auto-columns:calc((100% - 12px)/2)}.event-strip.cards-3{grid-auto-columns:calc((100% - 24px)/3)}.event-strip.cards-4{grid-auto-columns:calc((100% - 36px)/4)}.event-card{height:132px;width:100%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:13px 14px;border:1px solid #519e6a;border-radius:5px;background:#e9f5ed;color:#193d26;overflow:hidden}.vscode-dark .event-card,.vscode-high-contrast .event-card{background:#223b2e;color:#dbeee2;border-color:#62ac7c}.vscode-high-contrast .event-card,.vscode-high-contrast-light .event-card{border-width:2px}.event-heading{display:flex;align-items:center;gap:8px;line-height:20px}.event-heading strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.event-heading>span{margin-left:auto;font-size:12px;white-space:nowrap;flex-shrink:0}.event-metrics{font-size:11px;margin-top:auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85;display:flex;justify-content:space-between;gap:8px}.event-duration{font-size:24px;font-weight:500;margin-top:12px}.timeline-empty{padding:44px 0;text-align:center;color:var(--vscode-descriptionForeground,#aaa)}@media(max-width:1000px){.event-strip.cards-3,.event-strip.cards-4{grid-auto-columns:calc((100% - 12px)/2)}}@media(max-width:650px){.bucket{grid-template-columns:48px minmax(0,1fr);gap:10px}.event-strip.cards-2,.event-strip.cards-3,.event-strip.cards-4{grid-auto-columns:100%}.bucket-time{font-size:11px}}.empty{padding:70px 0;color:var(--vscode-descriptionForeground,#aaa);text-align:center;line-height:2}.hint{margin-top:22px;color:var(--vscode-descriptionForeground,#aaa);font-size:12px} @media(max-width:650px){body{padding:12px}header{gap:0;flex-wrap:wrap;height:auto;min-height:64px}nav{margin-left:2px;gap:0}td,th{padding:10px 4px}.line{gap:6px}.entry .path{margin-left:0}.time{width:94px}table{font-size:12px}}

.idle-card,.idle-card:hover{background:#fff5ce;border-color:#b29130;color:#594500;cursor:default}.vscode-dark .idle-card,.vscode-dark .idle-card:hover,.vscode-high-contrast .idle-card,.vscode-high-contrast .idle-card:hover{background:#3e361f;border-color:#c4a64f;color:#f5e7af} .project-detail{padding:4px 0}.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0 14px}.detail-heading>strong{font-size:13px;font-weight:500}.detail-file{padding:18px 0;border-top:1px solid var(--vscode-panel-border,#444)}.file-heading{display:flex;justify-content:space-between;gap:24px}.file-location{min-width:0}.file-location>strong{font-size:14px;overflow-wrap:anywhere}.file-location .path{margin-top:6px;color:var(--vscode-descriptionForeground,#aaa)}.file-duration{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap;font-size:13px}.file-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px}.file-metrics>div{display:flex;align-items:center;gap:12px}.file-metrics>div>span{font-size:12px;color:var(--vscode-descriptionForeground,#aaa)}.file-metrics strong{font-size:13px;font-weight:500}.file-secondary{margin-top:14px}@media(max-width:650px){.detail{padding:14px 20px}.file-metrics{gap:12px}.file-metrics>div{flex-direction:column;align-items:flex-start;gap:6px}}
</style></head><body><header><button id="prev" aria-label="前一天">‹</button><input id="date" type="date" aria-label="日期"><button id="next" aria-label="后一天">›</button><nav><button id="tableTab" class="selected">表格</button><button id="timelineTab">时间线</button></nav><button id="export" title="导出全部历史原始数据（JSON）">导出</button></header><div id="warnings" class="hint" role="status"></div><main id="content"></main><script nonce="__NONCE__">
const vscode=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():{postMessage:()=>{},getState:()=>null,setState:()=>{}};
let saved=vscode.getState(),state={view:saved?.view==='timeline'?'timeline':'table',expanded:Array.isArray(saved?.expanded)?saved.expanded.filter(x=>typeof x==='string'):[]},data={groups:[],rows:[]};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>t>0&&t<3000?'不足0.1分钟':`${Math.round(t/60000*10)/10}分钟`,clock=t=>new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),delta=r=>`<span class="plus">+${r.added}</span><span class="minus">-${r.deleted}</span>`;
const measured=(r,k)=>r.metricsVersion===2||r.measuredRecords?`${r[k]||0}${r.legacyRecords?' *':''}`:'—';
const scrollPositions=new Map();
let scrollDate;
function preserveScroll(){document.querySelectorAll('.event-strip').forEach(el=>scrollPositions.set(el.dataset.bucket,el.scrollLeft));}
function updateArrows(strip){const body=strip.closest('.bucket-body');const controls=body.querySelector('.row-tools');if(controls)controls.hidden=strip.scrollWidth<=strip.clientWidth+1;body.querySelectorAll('[data-shift]').forEach(b=>{b.disabled=Number(b.dataset.shift)<0?strip.scrollLeft<=1:strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-1;});}
function restoreScroll(){document.querySelectorAll('.event-strip').forEach(el=>{el.scrollLeft=scrollPositions.get(el.dataset.bucket)||0;el.onscroll=()=>{scrollPositions.set(el.dataset.bucket,el.scrollLeft);updateArrows(el);};updateArrows(el);});}
window.addEventListener('resize',()=>document.querySelectorAll('.event-strip').forEach(updateArrows));
function projectDetail(project){
 return `<section class="project-detail" aria-label="${esc(project.name)} 项目详情"><div class="detail-heading"><strong>文件明细</strong><span class="muted">${esc(data.date)} · ${project.files.length} 个文件</span></div>${project.files.map(f=>`<div class="detail-file"><div class="file-heading"><div class="file-location"><strong>${esc(String(f.path||'未命名文件').split(/[\\/]/).pop())}</strong><div class="path">${esc(f.path)}</div></div><div class="file-duration"><span>实际用时 ${mins(f.dwell)}</span><span class="muted">活跃 ${mins(f.active)}</span></div></div><div class="file-metrics"><div><span>文档变更</span><strong>${measured(f,'changeEvents')} 次</strong></div><div><span>字符增删</span><strong>${delta(f)}</strong></div><div><span>键盘活动</span><strong>${measured(f,'keyboardEvents')} 次</strong></div><div><span>保存</span><strong>${measured(f,'saves')} 次</strong></div></div><div class="file-secondary muted">鼠标选择 ${measured(f,'mouseEvents')} 次 · 换行 +${f.linesAdded||0} / -${f.linesDeleted||0} · 撤销 ${f.undo||0} / 重做 ${f.redo||0}</div></div>`).join('')}</section>`;
}
function drawTimeline(){
 const model=data.timeline||{buckets:[]};
 return '<div class="timeline">'+model.buckets.map(bucket=>{
  const key=String(bucket.start),count=bucket.items.length+(bucket.idle>0?1:0);
  return `<section class="bucket"><time class="bucket-time" title="${esc(new Date(bucket.start).toString())}">${clock(bucket.start)}</time><div class="bucket-body"><div class="event-strip cards-${Math.min(4,count)}" data-bucket="${key}" tabindex="0" role="region" aria-label="${clock(bucket.start)} 项目与空闲，可左右滚动">${bucket.items.map(item=>{
   return `<article class="event-card"><span class="event-heading"><strong title="${esc(item.name)}">${esc(item.name)}</strong></span><span class="event-duration" title="本时段实际用时；跨时段记录按重叠时长分摊">${mins(item.dwell)}</span><span class="event-metrics">${item.files.length} 个文件<span>活跃 ${mins(item.active)}</span></span></article>`;
  }).join('')}${bucket.idle>0?`<div class="event-card idle-card" role="note" aria-label="空闲 ${mins(bucket.idle)}" title="30 分钟减去本时段全部项目的实际用时"><span class="event-heading"><strong>空闲</strong></span><span class="event-duration">${mins(bucket.idle)}</span><span class="event-metrics">本时段未计入项目的时间</span></div>`:''}</div>${count>1?`<div class="row-tools"><button data-shift="-1" data-strip="${key}" aria-label="向左查看项目">‹</button><button data-shift="1" data-strip="${key}" aria-label="向右查看项目">›</button></div>`:''}</div></section>`;
 }).join('')+(model.buckets.length?'':'<div class="timeline-empty">当天暂无记录</div>')+'</div>';
}
function draw(){ preserveScroll(); $('tableTab').classList.toggle('selected',state.view==='table');$('timelineTab').classList.toggle('selected',state.view==='timeline');vscode.setState(state);if(!data.rows.length){$('content').innerHTML='<div class="empty">当天暂无记录<br><span class="muted">打开文件开始工作，统计会自动记录。</span></div>';return;}
if(state.view==='table'){$('content').innerHTML='<div class="table-scroll"><table><thead><tr><th>项目</th><th>实际用时</th><th>活跃时间</th><th>文件变更</th><th>键盘活动</th><th>保存次数</th></tr></thead><tbody>'+data.groups.map((g,i)=>{const expanded=state.expanded.includes('project:'+g.project);return `<tr><td><button class="chev" data-expand="${i}" aria-label="${expanded?'收起文件':'展开文件'}" aria-expanded="${expanded}">${expanded?'⌄':'›'}</button><span class="name">${esc(g.name)}</span><button class="pencil" data-alias="${i}" aria-label="重命名项目">✎</button></td><td title="代码文件前台停留时间，包含静止阅读">${mins(g.dwell)}</td><td title="近期有键盘、鼠标选择或滚动活动的前台时间">${mins(g.active)}</td><td title="VS Code 已打开文档的累计变更，可能包含 Git 操作；并非仓库净差异"><div>${g.changedFiles} 文件 · ${measured(g,'changeEvents')} 次</div><div class="muted">${delta(g)} 字符</div></td><td title="VS Code 键盘来源的选择变化事件，非物理按键总数">${measured(g,'keyboardEvents')} 次</td><td title="包含手动保存和自动保存">${measured(g,'saves')} 次</td></tr>`+(expanded?`<tr><td colspan="6" class="detail">${projectDetail(g)}</td></tr>`:'');}).join('')+'</tbody></table></div>'; }
else{$('content').innerHTML=drawTimeline();restoreScroll();}}
$('content').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.shift){const strip=[...document.querySelectorAll('.event-strip')].find(el=>el.dataset.bucket===b.dataset.strip);if(strip)strip.scrollBy({left:Number(b.dataset.shift)*strip.clientWidth,behavior:'smooth'});return;}for(const field of ['alias'])if(b.dataset[field]!==undefined){vscode.postMessage({type:'edit',field,project:data.groups[+b.dataset[field]].project});return;}const key=b.dataset.expand!==undefined?'project:'+data.groups[+b.dataset.expand].project:b.dataset.row!==undefined?'row:'+b.dataset.row:null;if(key){state.expanded=state.expanded.includes(key)?state.expanded.filter(x=>x!==key):[...state.expanded,key];const index=b.dataset.expand;draw();document.querySelector('[data-expand="'+index+'"]')?.focus({preventScroll:true});}};
$('export').onclick=()=>vscode.postMessage({type:'export'});
$('tableTab').onclick=()=>{state.view='table';draw()};$('timelineTab').onclick=()=>{state.view='timeline';draw()};$('date').onchange=()=>vscode.postMessage({type:'date',value:$('date').value});function shift(n){const d=new Date($('date').value+'T12:00:00');d.setDate(d.getDate()+n);const v=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');vscode.postMessage({type:'date',value:v});} $('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
window.addEventListener('message',e=>{if(e.data.type==='data'){if(scrollDate!==e.data.date){scrollPositions.clear();document.querySelectorAll('.event-strip').forEach(el=>el.scrollLeft=0);scrollDate=e.data.date;}data=e.data;$('date').value=data.date;$('warnings').textContent=(data.warnings||[]).join(' ');draw();}});vscode.postMessage({type:'ready'});
</script></body></html>
