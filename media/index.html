<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><style nonce="__NONCE__">
:root{color-scheme:light dark}*{box-sizing:border-box}body{font:14px var(--vscode-font-family,system-ui);color:var(--vscode-foreground,#ccc);background:var(--vscode-editor-background,#1e1e1e);margin:0;padding:24px 28px}header{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--vscode-panel-border,#383838);margin-bottom:24px;height:64px}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;padding:8px 12px;border-radius:3px}button:hover{background:var(--vscode-list-hoverBackground,#303030)}button:focus-visible,input:focus-visible{outline:1px solid var(--vscode-focusBorder,#007acc)}input{background:transparent;border:0;padding:8px;width:150px}nav{display:flex;align-self:stretch;margin-left:18px;gap:18px}nav button{border-radius:0;border-bottom:2px solid transparent;padding:8px 12px}nav button.selected{color:var(--vscode-textLink-foreground,#4daafc);border-color:var(--vscode-textLink-foreground,#4daafc)}table{width:100%;border-collapse:collapse;text-align:left}th{font-weight:500;color:var(--vscode-descriptionForeground,#aaa);padding:12px 8px;font-size:13px}td{padding:12px 8px;border-top:1px solid var(--vscode-panel-border,#383838)}th:nth-child(n+3),td:nth-child(n+3){text-align:right;white-space:nowrap}.name{font-weight:600}.chev{width:28px;padding:4px}.pencil{font-size:16px;opacity:.65;padding:4px 8px}.task{padding:0;white-space:nowrap}.muted{color:var(--vscode-descriptionForeground,#aaa);font-size:12px}.plus{color:var(--vscode-gitDecoration-addedResourceForeground,#81b88b)}.minus{color:var(--vscode-gitDecoration-deletedResourceForeground,#e48787);margin-left:12px}.unassigned{color:var(--vscode-editorWarning-foreground,#cca700)}.detail{padding:14px 36px;background:var(--vscode-list-inactiveSelectionBackground,#252526)}.file{padding:6px 0}.path{font:12px var(--vscode-editor-font-family,monospace);overflow-wrap:anywhere;white-space:normal}.file .muted{margin-top:5px}.timeline{padding:0 6px}.entry{position:relative;margin-left:7px;border-left:1px solid var(--vscode-panel-border,#555);padding:0 0 30px 24px}.entry:before{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#999;left:-5px;top:13px}.line{display:flex;align-items:center;gap:18px;min-height:36px}.time{font-variant-numeric:tabular-nums;color:var(--vscode-descriptionForeground,#aaa);width:112px;flex-shrink:0}.duration{margin-left:auto;white-space:nowrap}.entry .path{margin:6px 0 8px 148px}.empty{padding:70px 0;color:var(--vscode-descriptionForeground,#aaa);text-align:center;line-height:2}.hint{margin-top:22px;color:var(--vscode-descriptionForeground,#aaa);font-size:12px} @media(max-width:650px){body{padding:12px}header{gap:0}nav{margin-left:2px;gap:0}td,th{padding:10px 4px}.line{gap:6px}.entry .path{margin-left:0}.time{width:94px}table{font-size:12px}}
</style></head><body><header><button id="prev" aria-label="前一天">‹</button><input id="date" type="date" aria-label="日期"><button id="next" aria-label="后一天">›</button><nav><button id="tableTab" class="selected">表格</button><button id="timelineTab">时间线</button></nav></header><div id="warnings" class="hint" role="status"></div><main id="content"></main><script nonce="__NONCE__">
const vscode=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():{postMessage:()=>{},getState:()=>null,setState:()=>{}};
let saved=vscode.getState(),state={view:saved?.view==='timeline'?'timeline':'table',expanded:Array.isArray(saved?.expanded)?saved.expanded.filter(x=>typeof x==='string'):[]},data={groups:[],rows:[]};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>`${Math.round(t/60000*10)/10}分钟`,clock=t=>new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),delta=r=>`<span class="plus">+${r.added}</span><span class="minus">-${r.deleted}</span>`;
function draw(){ $('tableTab').classList.toggle('selected',state.view==='table');$('timelineTab').classList.toggle('selected',state.view==='timeline');vscode.setState(state);if(!data.rows.length){$('content').innerHTML='<div class="empty">当天暂无记录<br><span class="muted">打开文件开始工作，统计会自动记录。</span></div>';return;}
if(state.view==='table'){$('content').innerHTML='<table><thead><tr><th>项目</th><th>Jira任务</th><th>实际用时</th><th>填报工时</th><th>累计增删</th></tr></thead><tbody>'+data.groups.map((g,i)=>{const expanded=state.expanded.includes(g.project);return `<tr><td><button class="chev" data-expand="${i}" aria-label="展开文件">${expanded?'⌄':'›'}</button><span class="name">${esc(g.name)}</span><button class="pencil" data-alias="${i}" aria-label="重命名项目">✎</button></td><td><button class="task ${g.task?'':'unassigned'}" data-task="${i}">${esc(g.task||'未分配')}</button>${g.task?` <span class="muted">${esc(g.type)}</span>`:''}</td><td title="前台停留时间；核对后用于工时填写">${mins(g.dwell)}</td><td title="按当天同一任务合并后四舍五入；需自行核对">${g.hours===null?'—':g.hours+'h'}${g.shared?' *':''}</td><td title="UTF-16字符累计新增与删除，含撤销和未提交编辑">${delta(g)}</td></tr>`+(expanded?`<tr><td colspan="5" class="detail">${g.files.map(f=>`<div class="file"><div class="path">${esc(f.path)}</div><div class="muted">停留 ${mins(f.dwell)} · 活跃 ${mins(f.active)} · ${delta(f)}</div></div>`).join('')}</td></tr>`:'');}).join('')+'</tbody></table>'+(data.groups.some(g=>g.shared)?'<div class="hint">* 同一任务的合计工时仅在首行显示。</div>':'');}
else{$('content').innerHTML='<div class="timeline">'+data.rows.slice().sort((a,b)=>a.start-b.start).map((r,i)=>`<div class="entry"><div class="line"><span class="time">${clock(r.start)} – ${clock(r.end)}</span><button data-row="${esc(r.id)}" aria-label="展开文件">${state.expanded.includes(r.id)?'⌄':'›'}</button><span class="name">${esc(r.name)}</span>${!r.task?'<span class="unassigned muted">未分配</span>':''}<span class="duration">${mins(r.dwell)}</span></div>${state.expanded.includes(r.id)?`<div class="path">${esc(r.path)}<div class="muted">${esc(r.task)} · 活跃 ${mins(r.active)} · ${delta(r)}</div></div>`:''}</div>`).join('')+'</div>';}}
$('content').onclick=e=>{const b=e.target.closest('button');if(!b)return;for(const field of ['alias','task'])if(b.dataset[field]!==undefined){vscode.postMessage({type:'edit',field,project:data.groups[+b.dataset[field]].project});return;}const key=b.dataset.expand!==undefined?data.groups[+b.dataset.expand].project:b.dataset.row;if(key){state.expanded=state.expanded.includes(key)?state.expanded.filter(x=>x!==key):[...state.expanded,key];draw();}};
$('tableTab').onclick=()=>{state.view='table';draw()};$('timelineTab').onclick=()=>{state.view='timeline';draw()};$('date').onchange=()=>vscode.postMessage({type:'date',value:$('date').value});function shift(n){const d=new Date($('date').value+'T12:00:00');d.setDate(d.getDate()+n);const v=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');vscode.postMessage({type:'date',value:v});} $('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
window.addEventListener('message',e=>{if(e.data.type==='data'){data=e.data;$('date').value=data.date;$('warnings').textContent=(data.warnings||[]).join(' ');draw();}});vscode.postMessage({type:'ready'});
</script></body></html>
