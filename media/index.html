<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><style nonce="__NONCE__">
:root{color-scheme:light}body.vscode-dark,body.vscode-high-contrast{color-scheme:dark}body.vscode-high-contrast-light{color-scheme:light}*{box-sizing:border-box}body{font:14px var(--vscode-font-family,system-ui);color:var(--vscode-foreground,#ccc);background:var(--vscode-editor-background,#1e1e1e);margin:0;padding:24px 28px}#export{margin-left:auto;white-space:nowrap;border:1px solid var(--vscode-panel-border,#383838)}header{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--vscode-panel-border,#383838);margin-bottom:24px;height:64px}button,input{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;padding:8px 12px;border-radius:3px}button:hover{background:var(--vscode-list-hoverBackground,#303030)}button:focus-visible,input:focus-visible{outline:1px solid var(--vscode-focusBorder,#007acc)}input{background:transparent;border:0;padding:8px;width:150px}nav{display:flex;align-self:stretch;margin-left:18px;gap:18px}nav button{border-radius:0;border-bottom:2px solid transparent;padding:8px 12px}nav button.selected{color:var(--vscode-textLink-foreground,#4daafc);border-color:var(--vscode-textLink-foreground,#4daafc)}.table-scroll{overflow-x:auto}table{min-width:720px;width:100%;border-collapse:collapse;text-align:left}th{font-weight:500;color:var(--vscode-descriptionForeground,#aaa);padding:12px 8px;font-size:13px}td{padding:12px 8px;border-top:1px solid var(--vscode-panel-border,#383838)}th:nth-child(n+2),td:nth-child(n+2){text-align:right;white-space:nowrap}.name{font-weight:600}.chev{width:28px;padding:4px}.pencil{font-size:16px;opacity:.65;padding:4px 8px}.muted{color:var(--vscode-descriptionForeground,#aaa);font-size:12px}.plus{color:var(--vscode-gitDecoration-addedResourceForeground,#81b88b)}.minus{color:var(--vscode-gitDecoration-deletedResourceForeground,#e48787);margin-left:12px}.name{overflow-wrap:anywhere}.detail{padding:14px 36px;background:var(--vscode-list-inactiveSelectionBackground,#252526)}.file{padding:6px 0}.path{font:12px var(--vscode-editor-font-family,monospace);overflow-wrap:anywhere;white-space:normal}.file .muted{margin-top:5px}.timeline-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 20px}.timeline-filter{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--vscode-descriptionForeground,#aaa)}#minMinutes{width:65px;border:1px solid var(--vscode-input-border,#555);background:var(--vscode-input-background,#292929);border-radius:3px;padding:5px}.bucket{display:grid;grid-template-columns:74px minmax(0,1fr);gap:18px;border-top:1px solid var(--vscode-panel-border,#383838);padding:16px 0}.bucket-time{font:13px var(--vscode-editor-font-family,monospace);color:var(--vscode-descriptionForeground,#aaa);padding-top:8px}.bucket-body{min-width:0}.row-tools{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:var(--vscode-descriptionForeground,#aaa)}.row-tools button{padding:2px 9px;border:1px solid var(--vscode-panel-border,#444)}.row-tools button:disabled{opacity:.3;cursor:default}.event-strip{display:grid;grid-auto-flow:column;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:9px;scrollbar-width:thin;grid-auto-columns:100%}.event-strip.cards-2{grid-auto-columns:calc((100% - 12px)/2)}.event-strip.cards-3{grid-auto-columns:calc((100% - 24px)/3)}.event-strip.cards-4{grid-auto-columns:calc((100% - 36px)/4)}.event-card{height:156px;width:100%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:13px 14px;border:1px solid #519e6a;border-radius:5px;background:#e9f5ed;color:#193d26;overflow:hidden}.event-card:hover,.event-card[aria-expanded="true"]{background:#d8ecdf;border-color:#247140}.vscode-dark .event-card,.vscode-high-contrast .event-card{background:#223b2e;color:#dbeee2;border-color:#62ac7c}.vscode-dark .event-card:hover,.vscode-dark .event-card[aria-expanded="true"],.vscode-high-contrast .event-card:hover{background:#2b4938;border-color:#8cdda6}.vscode-high-contrast .event-card,.vscode-high-contrast-light .event-card{border-width:2px}.event-heading{display:flex;align-items:center;gap:8px;line-height:20px}.event-heading strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.event-heading>span{margin-left:auto;font-size:12px;white-space:nowrap;flex-shrink:0}.event-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px var(--vscode-editor-font-family,monospace);margin-top:8px;opacity:.82}.event-time{font-size:12px;margin-top:6px}.event-badge{font-size:11px;margin-top:6px;min-height:14px;opacity:.8}.event-metrics{font-size:11px;margin-top:auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}.event-detail{background:var(--vscode-list-inactiveSelectionBackground,#252526);padding:15px 18px;border-radius:4px;margin-top:8px;overflow-wrap:anywhere}.event-detail .muted{margin-top:6px}.timeline-empty{padding:44px 0;text-align:center;color:var(--vscode-descriptionForeground,#aaa)}@media(max-width:1000px){.event-strip.cards-3,.event-strip.cards-4{grid-auto-columns:calc((100% - 12px)/2)}}@media(max-width:650px){.bucket{grid-template-columns:48px minmax(0,1fr);gap:10px}.event-strip.cards-2,.event-strip.cards-3,.event-strip.cards-4{grid-auto-columns:100%}.timeline-filter{margin-left:0}.bucket-time{font-size:11px}}.empty{padding:70px 0;color:var(--vscode-descriptionForeground,#aaa);text-align:center;line-height:2}.hint{margin-top:22px;color:var(--vscode-descriptionForeground,#aaa);font-size:12px} @media(max-width:650px){body{padding:12px}header{gap:0;flex-wrap:wrap;height:auto;min-height:64px}nav{margin-left:2px;gap:0}td,th{padding:10px 4px}.line{gap:6px}.entry .path{margin-left:0}.time{width:94px}table{font-size:12px}}
</style></head><body><header><button id="prev" aria-label="前一天">‹</button><input id="date" type="date" aria-label="日期"><button id="next" aria-label="后一天">›</button><nav><button id="tableTab" class="selected">表格</button><button id="timelineTab">时间线</button></nav><button id="export" title="导出当前日期或全部历史的 JSON 原始记录">导出原始数据</button></header><div id="warnings" class="hint" role="status"></div><main id="content"></main><script nonce="__NONCE__">
const vscode=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():{postMessage:()=>{},getState:()=>null,setState:()=>{}};
let saved=vscode.getState(),state={view:saved?.view==='timeline'?'timeline':'table',expanded:Array.isArray(saved?.expanded)?saved.expanded.filter(x=>typeof x==='string'):[]},data={groups:[],rows:[]};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>`${Math.round(t/60000*10)/10}分钟`,clock=t=>new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),delta=r=>`<span class="plus">+${r.added}</span><span class="minus">-${r.deleted}</span>`;
const measured=(r,k)=>r.metricsVersion===2||r.measuredRecords?`${r[k]||0}${r.legacyRecords?' *':''}`:'—';
const workload=r=>`文档变更 ${measured(r,'changeEvents')} 次 · ${delta(r)} 字符 · +${r.linesAdded||0} / -${r.linesDeleted||0} 换行 · 键盘活动 ${measured(r,'keyboardEvents')} 次 · 鼠标选择 ${measured(r,'mouseEvents')} 次 · 保存 ${measured(r,'saves')} 次 · 撤销 ${r.undo||0} / 重做 ${r.redo||0}`;
const metricHint='键盘活动仅统计 VS Code 标记为键盘来源的选择变化事件，并非物理按键总数；文档变更可能包含 Git、粘贴、格式化或扩展操作，不代表手工输入量。保存包含自动保存。— 表示旧记录未采集，* 表示仅含升级后记录。';
const scrollPositions=new Map();
let scrollDate,thresholdDraft=null;
function preserveScroll(){document.querySelectorAll('.event-strip').forEach(el=>scrollPositions.set(el.dataset.bucket,el.scrollLeft));}
function updateArrows(strip){const body=strip.closest('.bucket-body');body.querySelectorAll('[data-shift]').forEach(b=>{b.disabled=Number(b.dataset.shift)<0?strip.scrollLeft<=1:strip.scrollLeft+strip.clientWidth>=strip.scrollWidth-1;});}
function restoreScroll(){document.querySelectorAll('.event-strip').forEach(el=>{el.scrollLeft=scrollPositions.get(el.dataset.bucket)||0;el.onscroll=()=>{scrollPositions.set(el.dataset.bucket,el.scrollLeft);updateArrows(el);};updateArrows(el);});}
window.addEventListener('resize',()=>document.querySelectorAll('.event-strip').forEach(updateArrows));
function drawTimeline(){
 const model=data.timeline||{minMinutes:2,visible:0,hidden:data.rows.length,buckets:[]};
 return `<div class="timeline-toolbar"><span class="muted">显示 ${model.visible} 个事件 · 已隐藏 ${model.hidden} 个短事件</span><label class="timeline-filter">隐藏不足 <input id="minMinutes" type="number" min="0" max="1440" step="any" value="${esc(thresholdDraft??model.minMinutes)}" aria-label="时间线最短事件分钟数"> 分钟的事件<button id="applyMin">应用</button></label></div><div class="timeline">`+model.buckets.map(bucket=>{
  const key=String(bucket.start),selected=bucket.items.find(item=>state.selectedEvent===key+':'+data.rows[item.index].id);
  return `<section class="bucket"><time class="bucket-time" title="${esc(new Date(bucket.start).toString())}">${clock(bucket.start)}</time><div class="bucket-body">${bucket.items.length>1?`<div class="row-tools"><span>${bucket.items.length} 个事件</span><button data-shift="-1" data-strip="${key}" aria-label="向左查看事件">‹</button><button data-shift="1" data-strip="${key}" aria-label="向右查看事件">›</button></div>`:''}<div class="event-strip cards-${Math.min(4,bucket.items.length)}" data-bucket="${key}" tabindex="0" role="region" aria-label="${clock(bucket.start)} 编码事件，可左右滚动">${bucket.items.map(item=>{
   const r=data.rows[item.index],eventKey=key+':'+r.id;
   return `<button class="event-card" data-event="${esc(eventKey)}" aria-label="展开文件" aria-expanded="${state.selectedEvent===eventKey}" title="${esc(r.path)}"><span class="event-heading"><strong>${esc(r.name||r.projectName)}</strong><span>${mins(r.dwell)}</span></span><span class="event-path">${esc(r.path)}</span><span class="event-time">${clock(item.start)} – ${clock(item.end)}</span><span class="event-badge">${item.continued?'接续上一时段':''}${item.continued&&item.continues?' · ':''}${item.continues?'延续到下一时段':''}</span><span class="event-metrics">完整事件 · 键盘 ${measured(r,'keyboardEvents')} 次 · 保存 ${measured(r,'saves')} 次</span></button>`;
  }).join('')}</div>${selected?(()=>{const r=data.rows[selected.index];return `<div class="event-detail"><div class="path">${esc(r.path)}</div><div class="muted">完整事件 ${clock(r.start)} – ${clock(r.end)} · 停留 ${mins(r.dwell)} · 活跃 ${mins(r.active)}</div><div class="muted">${workload(r)}</div></div>`;})():''}</div></section>`;
 }).join('')+(model.buckets.length?'':'<div class="timeline-empty">当前阈值下暂无事件，可调低分钟数查看。</div>')+'</div><div class="hint">每半小时一组。跨时段卡片显示同一事件的完整计数，不重复计入汇总。阈值按整段事件的实际停留时间筛选，表格和原始导出保留全部记录。</div><div class="hint">'+metricHint+'</div>';
}
function draw(){ preserveScroll(); $('tableTab').classList.toggle('selected',state.view==='table');$('timelineTab').classList.toggle('selected',state.view==='timeline');vscode.setState(state);if(!data.rows.length){$('content').innerHTML='<div class="empty">当天暂无记录<br><span class="muted">打开文件开始工作，统计会自动记录。</span></div>';return;}
if(state.view==='table'){$('content').innerHTML='<div class="table-scroll"><table><thead><tr><th>项目</th><th>实际用时</th><th>活跃时间</th><th>文件变更</th><th>键盘活动</th><th>保存次数</th></tr></thead><tbody>'+data.groups.map((g,i)=>{const expanded=state.expanded.includes('project:'+g.project);return `<tr><td><button class="chev" data-expand="${i}" aria-label="展开文件">${expanded?'⌄':'›'}</button><span class="name">${esc(g.name)}</span><button class="pencil" data-alias="${i}" aria-label="重命名项目">✎</button>${g.projects.length>1?`<div class="muted">合并 ${g.projects.length} 个路径</div>`:''}</td><td title="代码文件前台停留时间，包含静止阅读">${mins(g.dwell)}</td><td title="近期有键盘、鼠标选择或滚动活动的前台时间">${mins(g.active)}</td><td title="VS Code 已打开文档的累计变更，可能包含 Git 操作；并非仓库净差异"><div>${g.changedFiles} 文件 · ${measured(g,'changeEvents')} 次</div><div class="muted">${delta(g)} 字符</div></td><td title="VS Code 键盘来源的选择变化事件，非物理按键总数">${measured(g,'keyboardEvents')} 次</td><td title="包含手动保存和自动保存">${measured(g,'saves')} 次</td></tr>`+(expanded?`<tr><td colspan="6" class="detail">${g.files.map(f=>`<div class="file"><div class="path">${esc(f.path)}</div><div class="muted">停留 ${mins(f.dwell)} · 活跃 ${mins(f.active)}</div><div class="muted">${workload(f)}</div></div>`).join('')}</td></tr>`:'');}).join('')+'</tbody></table></div><div class="hint">同名项目自动合并，文件明细保留原路径。'+metricHint+'</div>'; }
else{$('content').innerHTML=drawTimeline();restoreScroll();}}
$('content').oninput=e=>{if(e.target.id==='minMinutes')thresholdDraft=e.target.value;};
$('content').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='applyMin'){const input=$('minMinutes');if(input.value!==''&&input.checkValidity()){thresholdDraft=null;vscode.postMessage({type:'timelineThreshold',value:Number(input.value)});}return;}if(b.dataset.shift){const strip=[...document.querySelectorAll('.event-strip')].find(el=>el.dataset.bucket===b.dataset.strip);if(strip)strip.scrollBy({left:Number(b.dataset.shift)*strip.clientWidth,behavior:'smooth'});return;}if(b.dataset.event){state.selectedEvent=state.selectedEvent===b.dataset.event?null:b.dataset.event;draw();return;}for(const field of ['alias'])if(b.dataset[field]!==undefined){vscode.postMessage({type:'edit',field,project:data.groups[+b.dataset[field]].project});return;}const key=b.dataset.expand!==undefined?'project:'+data.groups[+b.dataset.expand].project:b.dataset.row!==undefined?'row:'+b.dataset.row:null;if(key){state.expanded=state.expanded.includes(key)?state.expanded.filter(x=>x!==key):[...state.expanded,key];draw();}};
$('export').onclick=()=>vscode.postMessage({type:'export'});
$('tableTab').onclick=()=>{state.view='table';draw()};$('timelineTab').onclick=()=>{state.view='timeline';draw()};$('date').onchange=()=>vscode.postMessage({type:'date',value:$('date').value});function shift(n){const d=new Date($('date').value+'T12:00:00');d.setDate(d.getDate()+n);const v=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');vscode.postMessage({type:'date',value:v});} $('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
window.addEventListener('message',e=>{if(e.data.type==='data'){if(scrollDate!==e.data.date){scrollPositions.clear();document.querySelectorAll('.event-strip').forEach(el=>el.scrollLeft=0);scrollDate=e.data.date;}data=e.data;$('date').value=data.date;$('warnings').textContent=(data.warnings||[]).join(' ');draw();}});vscode.postMessage({type:'ready'});
</script></body></html>
